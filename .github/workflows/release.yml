name: Release

run-name: "Rolo ${{ inputs.version }} #${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 0.1.0"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 26
        run: |
          XCODE_PATH="$(find /Applications -maxdepth 1 -type d -name 'Xcode_26*.app' \
            -print | sort -V | tail -n1)"
          if [ -z "$XCODE_PATH" ]; then
            echo "::error::No Xcode 26.x found on this runner. Installed Xcodes:"
            find /Applications -maxdepth 1 -type d -iname '*xcode*' -print
            exit 1
          fi
          echo "Using $XCODE_PATH"
          echo "DEVELOPER_DIR=$XCODE_PATH/Contents/Developer" >> "$GITHUB_ENV"

      - name: Compute release metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must be plain semver, for example 0.1.0."
            exit 1
          fi
          {
            echo "version=${VERSION}"
            echo "dmg_file=Rolo-${VERSION}.dmg"
            echo "zip_file=Rolo-${VERSION}.zip"
          } >> "$GITHUB_OUTPUT"

      - name: Import signing certificate
        timeout-minutes: 2
        env:
          P12_BASE64: ${{ secrets.SIGNING_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KPW="$(openssl rand -base64 24)"
          echo "${P12_BASE64}" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KPW" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KPW" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "${P12_PASSWORD}" \
            -T /usr/bin/codesign
          security find-certificate -c "Rolo Self-Signed" -p "$KEYCHAIN" \
            > "$RUNNER_TEMP/cert.pem"
          sudo -n security add-trusted-cert -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          security list-keychains -d user -s "$KEYCHAIN"
          security find-identity -p codesigning "$KEYCHAIN" | grep -F "Rolo Self-Signed"
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem"

      - name: Build app
        env:
          VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          xcodebuild -project Tinycast.xcodeproj -scheme Tinycast -configuration Release \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Rolo Self-Signed" \
            OTHER_CODE_SIGN_FLAGS="--timestamp=none" \
            PRODUCT_NAME="Rolo" PRODUCT_BUNDLE_IDENTIFIER="com.hintheshell.rolo" \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

      # Two artifacts from one build: the DMG people download and the cask installs, and the zip
      # the in-app updater installs — it expands with `ditto` instead of mounting a volume.
      - name: Package DMG and ZIP
        env:
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release/Rolo.app"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          mkdir -p dist
          diskutil image create from "$STAGE" --format UDZO --volumeName "Rolo" \
            "dist/${DMG_FILE}"
          # `ditto -c -k --keepParent --sequesterRsrc` is the only zip that leaves the code
          # signature verifiable; plain `zip` drops symlinks and breaks the seal.
          ditto -c -k --keepParent --sequesterRsrc "$APP" "dist/${ZIP_FILE}"

      - uses: actions/upload-artifact@v7
        with:
          name: Rolo-${{ steps.meta.outputs.version }}
          path: dist/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
          ZIP_FILE: ${{ steps.meta.outputs.zip_file }}
        run: |
          gh release create "v${VERSION}" "dist/${DMG_FILE}" "dist/${ZIP_FILE}" \
            --title "Rolo ${VERSION}" \
            --notes "**Version:** ${VERSION}
          **Bundle ID:** \`com.hintheshell.rolo\`
          Built from ${GITHUB_SHA}.

          Install or update with Homebrew:
          \`\`\`sh
          brew install --cask hintheshell/rolo/rolo
          \`\`\`

          This build is self-signed. Direct DMG downloads may need quarantine removed once:
          \`\`\`sh
          xattr -dr com.apple.quarantine \"/Applications/Rolo.app\"
          \`\`\`"

      - name: Update Homebrew cask
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          VERSION: ${{ steps.meta.outputs.version }}
          DMG_FILE: ${{ steps.meta.outputs.dmg_file }}
        run: |
          if [ -z "${TAP_DEPLOY_KEY}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not configured."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/homebrew-rolo-deploy-key"
          KNOWN_HOSTS="$RUNNER_TEMP/github-known-hosts"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          curl -fsSL https://api.github.com/meta \
            | jq -r '.ssh_keys[] | "github.com " + .' > "$KNOWN_HOSTS"
          export GIT_SSH_COMMAND="ssh -i $KEY_FILE -o IdentitiesOnly=yes -o UserKnownHostsFile=$KNOWN_HOSTS"
          SHA="$(shasum -a 256 "dist/${DMG_FILE}" | awk '{print $1}')"
          git clone --depth 1 git@github.com:hintheshell/homebrew-rolo.git tap
          CASK_FILE="tap/Casks/rolo.rb"
          sed -i '' -E "s|^  version \".*\"|  version \"${VERSION}\"|" "$CASK_FILE"
          sed -i '' -E "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" "$CASK_FILE"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/rolo.rb
          if git diff --cached --quiet; then
            echo "No cask changes to commit."
          else
            git commit -m "rolo ${VERSION}"
            git push
          fi
